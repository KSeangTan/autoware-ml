# @package _global_
defaults:
  - ../base
  - /metrics/t4dataset@metric_ranges: default_detection3d_120m_metric_ranges
  - _self_

point_cloud_range: [-122.4, -122.4, -3.0, 122.4, 122.4, 5.0]
voxel_size: [0.17, 0.17, 0.2]
# 244.8 m / 0.17 m = 1440 voxels per BEV axis, reduced to 180 by the three stride-2 stages of the
# sparse encoder, so the head works on a 180x180 grid at out_size_factor 8.
out_size_factor: 8

eval_class_range:
  car: 121.0
  truck: 121.0
  bus: 121.0
  bicycle: 121.0
  pedestrian: 121.0
  traffic_cone: 121.0
  barrier: 121.0

max_voxels: 120000
eval_max_voxels: 160000
max_num_points: 32
