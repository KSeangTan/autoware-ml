# @package _global_
defaults:
  - ../base
  # Loaded before _self_ so the dataloader and transform overrides below win over the defaults.
  - /datamodule@datamodule: t4dataset/default_detection3d_datamodule
  - /metrics/t4dataset@metric_ranges: default_detection3d_120m_metric_ranges
  - _self_

point_cloud_range: [-122.4, -122.4, -3.0, 122.4, 122.4, 5.0]

eval_class_range:
  car: 121.0
  truck: 121.0
  bus: 121.0
  bicycle: 121.0
  pedestrian: 121.0
  traffic_cone: 121.0
  barrier: 121.0

max_num_3d_gt_bboxes: 500

model:
  bbox_head:
    nms_min_radius: 1.0
  scheduler:
    max_lr_factor: 10.0

datamodule:
  # Overwrite dataloader
  train_dataloader:
    shuffle: true
  predict_dataloader:
    shuffle: false
    batch_size: 1

  # Overwrite transforms
  train_dataset:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all

          load_dim: ${database.lidar_pointcloud_num_features}
          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0

        - _target_: autoware_ml.transforms.point_cloud.loading.LoadMultiSweepPointsFromFile
          _convert_: all

          sweeps_num: 1
          bev_remove_radius: 1.0
          test_mode: false
          use_timestamp_difference: true
          load_dim: ${database.lidar_pointcloud_num_features}
          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalRotScaleTrans
          _convert_: all

          # In radians, the range of rotation angles for random rotation around the Z-axis.
          # The range is specified as [min_angle, max_angle].
          yaw_rot_range: [-1.571, 1.571]
          # The range of scale factors for random scaling.
          scale_ratio_range: [0.8, 1.2]
          # The standard deviation for Gaussian translation noise.
          translation_std: [1.0, 1.0, 0.2]

        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalBEVRandomFlip
          _convert_: all

          horizontal_flip_ratio: 0.5
          vertical_flip_ratio: 0.5

        - _target_: autoware_ml.transforms.point_cloud.filters.PointsRangeFilter
          _convert_: all

          points_range: ${point_cloud_range}

        - _target_: autoware_ml.transforms.point_cloud.perturbation.PointsRandomShuffle
          _convert_: all

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all

          label_names_to_keep: ${database.database_task_configs.detection3d.label_names}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesBEVDistanceFilter
          _convert_: all

          bev_range:
            - ${point_cloud_range.0}
            - ${point_cloud_range.1}
            - ${point_cloud_range.3}
            - ${point_cloud_range.4}

        # Order matters, it first filters bboxes within the default meters with less than 2 points.
        # Then it filters bboxes within 60 meters with less than 3 points
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all

          min_points: 2
          bev_range:
            - ${point_cloud_range.0}
            - ${point_cloud_range.1}
            - ${point_cloud_range.3}
            - ${point_cloud_range.4}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all

          min_points: 3
          bev_range: [-60.0, -60.0, 60.0, 60.0]

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          attributes_to_filter:
            bicycle:
              - vehicle_state.parked
              - cycle_state.without_rider
              - motorcycle_state.without_rider
