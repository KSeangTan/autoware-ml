# @package _global_
# The queries attend to every cell of the neck map with the shared CMT positional embedding in
# place of the deformable aggregation at the keypoints.
model:
  bbox_head:
    lidar_sampling: bev_attention
    # The fastest wave of the positional embedding repeats every 1 / 32 of the range and the
    # slowest about every 2 ranges. The embedding of CMT, scale 1 with temperature 10000, keeps
    # most of its features constant over the map and collapsed to one vector in training.
    position_scale: 32.0
    position_temperature: 64.0
    # With local_attention a query attends only to the cells within a radius of its anchor
    # center, which keeps the attention near the query while the embedding learns the position.
    # The radius opens by the epoch, [first epoch, meters], and null attends to every cell, as
    # the inference of the trained model does.
    local_attention: false
    local_attention_radii:
      - [0, 50.0]
      - [4, 90.0]
      - [6, 120.0]
      - [8, null]
    # With cosine_attention the logits are the cosine of the query and the key times a learned
    # scale per head, at most attention_scale_max, so a query spreads them by at most twice the
    # maximum. The logits of the scaled dot product grew until a query attended to one cell
    # and the head lost its objects.
    cosine_attention: false
    attention_scale_max: 30.0
    # Every cell of the neck map is layer normalized before the blocks project it. A few cells
    # of the map reach norms hundreds of times the median, and unnormalized they took the
    # softmax of the dot product and sent an exploding gradient to the backbone.
    bev_norm: true

# Every query attends to every cell of the map, an (N, H * W) attention per head. In float16
# without a mask it runs on the flash attention kernel, which never stores those logits. The
# layer norm of the cells and the losses compute in float32 under autocast.
trainer:
  precision: 16-mixed
