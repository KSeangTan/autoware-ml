# @package _global_

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/loss
    dirpath: ${hydra:run.dir}/checkpoints
    filename: best
    save_top_k: 1
    mode: min
    verbose: true

  model_checkpoint_last:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${hydra:run.dir}/checkpoints
    filename: last
    save_top_k: 1
    enable_version_counter: false

  early_stopping:
    _target_: autoware_ml.callbacks.early_stopping.EarlyStopping
    monitor: val/loss
    patience: 20
    mode: min

  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

  iteration_timer:
    _target_: autoware_ml.callbacks.iteration_timer.IterationTimer
    sync_cuda: false
    warmup_iters: 1
    log_interval: ${trainer.log_every_n_steps}

  data_processing_timer:
    _target_: autoware_ml.callbacks.data_processing_timer.DataProcessingTimer
    log_interval: ${trainer.log_every_n_steps}

  cpu_stats_monitor:
    _target_: autoware_ml.callbacks.cpu_stats_monitor.CPUStatsMonitor
    log_interval: ${trainer.log_every_n_steps}
    memory_stats: true

  gpu_stats_monitor:
    _target_: autoware_ml.callbacks.gpu_stats_monitor.GPUStatsMonitor
    log_interval: ${trainer.log_every_n_steps}
